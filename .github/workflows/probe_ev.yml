name: Probe eversports

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install chromium

      - name: Probe pages
        run: python probe_ev.py

      - name: Save results
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add probe_ev.txt probe_ev_page_1.txt probe_ev_page_2.txt
          if ! git diff --cached --quiet; then
            git commit -m "Save eversports probe results"
            git pull --rebase
            git push
          fi