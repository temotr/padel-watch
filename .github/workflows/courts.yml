name: Watch courts

on:
  schedule:
    - cron: "17,47 * * * *"   # backup schedule, every 30 minutes
  workflow_dispatch:         # lets cron-job.org and you start it

concurrency:
  group: courts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  courts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install chromium

      - name: Check courts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python courts.py

      - name: Save snapshot
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add courts_state.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update court snapshot"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi