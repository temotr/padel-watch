name: Watch events

on:
  schedule:
    - cron: "7 * * * *"   # every hour at minute 7
  workflow_dispatch:       # lets you run it manually

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check page
        id: check
        run: python check.py

      - name: Save snapshot
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add events.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update snapshot"
            git push
          fi

      # Fails on purpose when something new appears, so GitHub emails you.
      - name: Alert on change
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "::error::New content on the events page. Open the 'Check page' step to see what."
          exit 1
