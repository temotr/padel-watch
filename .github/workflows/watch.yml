name: Watch events

on:
  schedule:
    - cron: "7,37 * * * *"   # backup schedule, every 30 minutes
  workflow_dispatch:         # lets cron-job.org and you start it

concurrency:
  group: events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install chromium

      - name: Check page
        id: check
        run: python check.py

      - name: Save snapshot
        run: |
          git config user.name "watcher"
          git config user.email "watcher@users.noreply.github.com"
          git add events.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update snapshot"
            for i in 1 2 3; do
              git pull --rebase && git push && break
              sleep 5
            done
          fi

      - name: Alert on change
        if: steps.check.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Sun Set Padel events" -H "Tags: calendar" -H "Priority: high" -H "Click: https://sunsetpadel.at/events" -d "$SUMMARY" "https://ntfy.sh/$NTFY_TOPIC"
